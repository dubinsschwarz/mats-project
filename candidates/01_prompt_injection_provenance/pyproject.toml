[project]
name = "prompt-injection-provenance"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "datasets>=5.0.1",
  "numpy>=2.0",
  "pandas>=3.0,<3.0.4",
  "scikit-learn>=1.5",
  "torch==2.9.1",
  "transformers>=4.51",
  "zstandard>=0.25.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
